<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Garden Grow - Interactive Garden Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
        body{font-family:Arial,sans-serif;overflow:hidden;height:100vh;width:100vw;background:#000;position:fixed}
        #loading-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;z-index:9999}
        .loading-content{text-align:center;color:white}
        .loading-spinner{width:50px;height:50px;border:5px solid rgba(255,255,255,.3);border-radius:50%;border-top-color:#fff;animation:spin 1s infinite;margin:20px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        #auth-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#667eea,#764ba2);display:none;align-items:center;justify-content:center;z-index:9998}
        .auth-container{background:white;border-radius:20px;padding:30px;max-width:400px;width:90%}
        .auth-form input{width:100%;padding:12px;margin-bottom:15px;border:2px solid #ddd;border-radius:10px;font-size:16px}
        .auth-form button{width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer}
        .auth-switch{text-align:center;margin-top:15px;color:#666}
        .guest-mode{text-align:center;margin-top:20px}
        .guest-mode button{padding:10px 20px;background:#ddd;border:none;border-radius:10px;cursor:pointer;font-size:16px}
        #game-container{width:100%;height:100%;position:relative;display:none}
        #screens-container{display:flex;width:300%;height:100%;transition:transform .4s}
        .screen{width:33.333%;height:100%;position:relative;overflow:hidden}
        #shop-screen{background:linear-gradient(180deg,#3a2a1a,#5a3a2a)}
        .screen-header{background:rgba(0,0,0,.8);padding:60px 15px 15px;display:flex;justify-content:space-between;color:white}
        .shop-content{height:calc(100% - 120px);overflow-y:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
        .shop-item{background:rgba(255,255,255,.1);border:2px solid rgba(255,215,0,.3);border-radius:12px;padding:15px;text-align:center;color:white;cursor:pointer}
        .shop-item .seed-icon{font-size:48px;display:block;margin-bottom:10px}
        .shop-item .seed-price{font-size:14px;color:#ffd700}
        .rarity-common{background:#808080;padding:3px 8px;border-radius:10px;font-size:11px}
        .rarity-uncommon{background:#00cc00;padding:3px 8px;border-radius:10px;font-size:11px}
        .rarity-rare{background:#0066ff;padding:3px 8px;border-radius:10px;font-size:11px}
        .rarity-epic{background:#9900ff;padding:3px 8px;border-radius:10px;font-size:11px}
        .rarity-legendary{background:#ff6600;padding:3px 8px;border-radius:10px;font-size:11px}
        #garden-screen{background:linear-gradient(180deg,#87ceeb,#7ec850 30%,#5a9e35)}
        #top-bar{position:absolute;top:0;left:0;width:100%;padding:50px 10px 10px;display:flex;gap:5px;z-index:10}
        .stat-box{background:rgba(0,0,0,.6);padding:8px 12px;border-radius:20px;color:white;font-size:14px;font-weight:bold;display:flex;align-items:center;gap:5px}
        #xp-bar-container{flex:1;background:rgba(0,0,0,.3);overflow:hidden;position:relative;height:34px;border-radius:20px}
        #xp-bar{height:100%;background:linear-gradient(90deg,#4a9eff,#00ff00);transition:width .5s;border-radius:20px}
        #garden-area{position:absolute;top:15%;left:0;width:100%;height:75%}
        .soil-plot{position:absolute;width:80px;height:60px;background:radial-gradient(ellipse,#8b6914,#6b4f10);border-radius:50%;border:3px solid #5a3a0a;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
        .soil-plot.valid-drop{animation:pulse .5s infinite;border-color:#00ff00;box-shadow:0 0 20px #00ff00}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
        .plant-stage{font-size:40px;animation:idle 3s infinite}
        @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
        .plant.ready .plant-stage{animation:ready 1s infinite;filter:drop-shadow(0 0 10px #ffd700)}
        @keyframes ready{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
        .nav-arrow{position:absolute;top:50%;width:40px;height:40px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:30px;cursor:pointer;z-index:20}
        .nav-arrow.left{left:5px}
        .nav-arrow.right{right:5px}
        #bottom-bar{position:absolute;bottom:0;left:0;width:100%;padding:10px;z-index:10}
        #seed-bar{background:rgba(0,0,0,.7);border-radius:25px;padding:10px;display:flex;gap:8px;overflow-x:auto;margin-bottom:8px}
        .seed-item{min-width:70px;height:70px;background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0}
        .seed-item.selected{border-color:#ffd700;background:rgba(255,215,0,.2)}
        .seed-item .icon{font-size:30px}
        .seed-item .name{font-size:10px;color:white}
        .seed-item .quantity{position:absolute;top:2px;right:5px;font-size:10px;color:#ffd700;font-weight:bold}
        #tool-bar{display:flex;gap:8px}
        .tool-btn{flex:1;padding:10px;background:rgba(0,0,0,.7);border:2px solid transparent;border-radius:15px;color:white;font-size:12px;cursor:pointer;text-align:center}
        .tool-btn.active{border-color:#4a9eff;background:rgba(74,158,255,.3)}
        #inventory-screen{background:linear-gradient(180deg,#2a2a3a,#1a1a2a)}
        .inventory-content{height:calc(100% - 120px);overflow-y:auto;padding:15px;color:white}
        #ghost-seed{position:fixed;font-size:40px;pointer-events:none;z-index:1000;opacity:.8;transform:translate(-50%,-50%);display:none}
        #toast-container{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:2000}
        .toast{background:rgba(0,0,0,.8);color:white;padding:10px 20px;border-radius:20px;margin-bottom:10px;animation:fadeIn .3s}
        @keyframes fadeIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
        #modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:3000;display:none;align-items:center;justify-content:center}
        #modal-content{background:white;border-radius:20px;padding:20px;max-width:90%;max-height:80%;overflow-y:auto}
        .particle{position:absolute;pointer-events:none;z-index:100;animation:fly 1s forwards}
        @keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
        #logout-btn{position:absolute;top:10px;right:10px;z-index:100;background:rgba(255,0,0,.7);color:white;border:none;border-radius:20px;padding:8px 15px;cursor:pointer}
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="loading-content">
            <h1>🌱 Garden Grow</h1>
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>
    <div id="auth-screen">
        <div class="auth-container">
            <h1 style="text-align:center;margin-bottom:20px;">🌱 Garden Grow</h1>
            <div id="login-form" class="auth-form">
                <h2 style="text-align:center;">Welcome Back!</h2>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-password" placeholder="Password">
                <button onclick="handleLogin()">Login</button>
                <p class="auth-switch">No account? <a href="#" onclick="event.preventDefault();showSignup()">Sign Up</a></p>
            </div>
            <div id="signup-form" class="auth-form" style="display:none;">
                <h2 style="text-align:center;">Create Account</h2>
                <input type="email" id="signup-email" placeholder="Email">
                <input type="password" id="signup-password" placeholder="Password (min 6 chars)">
                <button onclick="handleSignup()">Sign Up</button>
                <p class="auth-switch">Have account? <a href="#" onclick="event.preventDefault();showLogin()">Login</a></p>
            </div>
            <div class="guest-mode">
                <p>or</p>
                <button onclick="playAsGuest()">🎮 Play as Guest</button>
                <p style="font-size:12px;color:#999;">No cloud save</p>
            </div>
        </div>
    </div>
    <div id="game-container">
        <div id="screens-container">
            <div id="shop-screen" class="screen">
                <div class="screen-header">
                    <h2>🏪 Seed Shop</h2>
                    <div>💎 <span id="shop-currency">0</span></div>
                </div>
                <div class="shop-content" id="shop-items"></div>
            </div>
            <div id="garden-screen" class="screen">
                <div id="top-bar">
                    <div class="stat-box">💎 <span id="currency-display">0</span></div>
                    <div class="stat-box">⭐ Lv.<span id="level-display">1</span></div>
                    <div class="stat-box">💧 <span id="water-display">0/10</span></div>
                    <div id="xp-bar-container"><div id="xp-bar"></div></div>
                </div>
                <div id="garden-area"></div>
                <div class="nav-arrow left" onclick="switchScreen(-1)">‹</div>
                <div class="nav-arrow right" onclick="switchScreen(1)">›</div>
                <button id="logout-btn" onclick="handleLogout()">Logout</button>
                <div id="bottom-bar">
                    <div id="seed-bar"></div>
                    <div id="tool-bar">
                        <button class="tool-btn active" data-tool="plant" onclick="selectTool('plant')">🌱 Plant</button>
                        <button class="tool-btn" data-tool="water" onclick="selectTool('water')">💧 Water</button>
                        <button class="tool-btn" data-tool="harvest" onclick="selectTool('harvest')">🎒 Harvest</button>
                        <button class="tool-btn" onclick="openInventory()">📦 Inv</button>
                        <button class="tool-btn" onclick="openQuests()">📜 Quests</button>
                    </div>
                </div>
            </div>
            <div id="inventory-screen" class="screen">
                <div class="screen-header">
                    <h2>🎒 Inventory</h2>
                    <button onclick="switchScreen(-1)" style="background:#007bff;color:white;border:none;border-radius:10px;padding:8px 15px;cursor:pointer;">← Back</button>
                </div>
                <div class="inventory-content" id="inventory-content"></div>
            </div>
        </div>
        <div id="modal-overlay"><div id="modal-content"></div></div>
        <div id="ghost-seed"></div>
        <div id="toast-container"></div>
    </div>
<script>
    // ==================== SUPABASE CONFIG ====================
    // PALITAN MO ITO NG IYONG SUPABASE CREDENTIALS
    const SUPABASE_CONFIG = {
        PROJECT_URL: 'https://dhvukkpqwyzayeosnzsg.supabase.co',
        PUBLIC_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRodnVra3Bxd3l6YXllb3NuenNnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MDM4NjcsImV4cCI6MjEwMjA3OTg2N30.qIXUpXO_RbF_zL7CNSQ3fTij8TfckpeM9TF7wFYVA9w'
    };
    
    let supabaseClient = null;
    let currentUser = null;
    let isGuest = false;
    let db = null;
    let gameLoopInterval = null;
    let autoSaveInterval = null;
    
    // ==================== SEED DATA ====================
    const seedData = {
        carrot: { name: 'Carrot', emoji: '🥕', stages: ['🌰', '🌱', '🌿', '🥕', '✨🥕'], growthTime: 30000, price: 10, sellValue: 20, rarity: 'common', waterNeeds: 2, xpReward: 5 },
        tomato: { name: 'Tomato', emoji: '🍅', stages: ['🌰', '🌱', '🌿', '🍅', '✨🍅'], growthTime: 45000, price: 20, sellValue: 40, rarity: 'common', waterNeeds: 3, xpReward: 8 },
        blueberry: { name: 'Blueberry', emoji: '🫐', stages: ['🌰', '🌱', '🌿', '🫐', '✨🫐'], growthTime: 60000, price: 30, sellValue: 60, rarity: 'uncommon', waterNeeds: 2, xpReward: 12 },
        moonflower: { name: 'Moonflower', emoji: '🌙', stages: ['🌰', '🌱', '🌿', '🌙', '✨🌙'], growthTime: 90000, price: 50, sellValue: 100, rarity: 'rare', waterNeeds: 3, xpReward: 20 },
        dragonfruit: { name: 'Dragon Fruit', emoji: '🐉', stages: ['🌰', '🌱', '🌿', '🐉', '✨🐉'], growthTime: 120000, price: 80, sellValue: 160, rarity: 'epic', waterNeeds: 4, xpReward: 30 },
        crystalbloom: { name: 'Crystal Bloom', emoji: '💎', stages: ['🌰', '🌱', '🌿', '💎', '✨💎'], growthTime: 180000, price: 120, sellValue: 240, rarity: 'epic', waterNeeds: 3, xpReward: 45 },
        rainbowrose: { name: 'Rainbow Rose', emoji: '🌈', stages: ['🌰', '🌱', '🌿', '🌈', '✨🌈'], growthTime: 240000, price: 200, sellValue: 400, rarity: 'legendary', waterNeeds: 5, xpReward: 60 },
        celestiallotus: { name: 'Celestial Lotus', emoji: '🌟', stages: ['🌰', '🌱', '🌿', '🌟', '✨🌟'], growthTime: 300000, price: 300, sellValue: 600, rarity: 'legendary', waterNeeds: 4, xpReward: 80 }
    };
    
    // ==================== QUEST DATA ====================
    const questData = [
        { id: 'plant3', description: 'Plant 3 seeds', target: 3, progress: 0, reward: 50, type: 'plant' },
        { id: 'harvest5', description: 'Harvest 5 crops', target: 5, progress: 0, reward: 100, type: 'harvest' },
        { id: 'earn100', description: 'Earn 100 Sh', target: 100, progress: 0, reward: 30, type: 'earn' },
        { id: 'water5', description: 'Water plants 5 times', target: 5, progress: 0, reward: 40, type: 'water' }
    ];
    
    // ==================== GAME STATE ====================
    const gameState = {
        currency: 500,
        farmLevel: 1,
        farmXP: 0,
        xpToNext: 100,
        waterCapacity: 10,
        currentWater: 10,
        selectedSeed: null,
        selectedTool: 'plant',
        currentScreen: 1,
        dayNightCycle: 'day',
        weather: 'sunny',
        weatherTimer: 0,
        plants: [],
        inventory: { seeds: {}, crops: {}, gear: {} },
        quests: [],
        plots: [],
        stats: { totalEarned: 0, totalPlanted: 0, totalHarvested: 0, totalWatered: 0, questsCompleted: 0 }
    };
    
    // ==================== INPUT STATE ====================
    let touchStartX = 0;
    let touchStartY = 0;
    let isSwiping = false;
    let isDraggingSeed = false;
    let dragSeedType = null;
    
    // ==================== INITIALIZATION ====================
    function initializeSupabase() {
        try {
            supabaseClient = supabase.createClient(SUPABASE_CONFIG.PROJECT_URL, SUPABASE_CONFIG.PUBLIC_ANON_KEY);
            console.log('Supabase initialized');
            return true;
        } catch (error) {
            console.error('Supabase init failed:', error);
            return false;
        }
    }
    
    function initializeNewGame() {
        gameState.currency = 500;
        gameState.farmLevel = 1;
        gameState.farmXP = 0;
        gameState.xpToNext = 100;
        gameState.waterCapacity = 10;
        gameState.currentWater = 10;
        gameState.inventory = { seeds: { carrot: 5, tomato: 3 }, crops: {}, gear: {} };
        gameState.plants = [];
        gameState.stats = { totalEarned: 0, totalPlanted: 0, totalHarvested: 0, totalWatered: 0, questsCompleted: 0 };
        gameState.quests = JSON.parse(JSON.stringify(questData));
    }
    
    function resetGameState() {
        Object.assign(gameState, {
            currency: 500, farmLevel: 1, farmXP: 0, xpToNext: 100,
            waterCapacity: 10, currentWater: 10, selectedSeed: null,
            selectedTool: 'plant', currentScreen: 1, dayNightCycle: 'day',
            weather: 'sunny', weatherTimer: 0, plants: [],
            inventory: { seeds: {}, crops: {}, gear: {} },
            quests: [], plots: [], stats: { totalEarned: 0, totalPlanted: 0, totalHarvested: 0, totalWatered: 0, questsCompleted: 0 }
        });
    }
    
    function playAsGuest() {
        isGuest = true;
        currentUser = null;
        initializeNewGame();
        showToast('Playing as guest - no cloud save');
        showGameScreen();
    }
    
    function showAuthScreen() {
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('loading-screen').style.display = 'none';
    }
    
    function showGameScreen() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'block';
        document.getElementById('loading-screen').style.display = 'none';
    }
    
    function showLogin() {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('signup-form').style.display = 'none';
    }
    
    function showSignup() {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('signup-form').style.display = 'block';
    }
    
    // ==================== AUTH FUNCTIONS ====================
    async function handleSignup() {
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        
        if (!email || !password) {
            showToast('Please fill in all fields');
            return;
        }
        
        if (password.length < 6) {
            showToast('Password must be at least 6 characters');
            return;
        }
        
        try {
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) throw error;
            if (data.user) {
                showToast('Account created! Check email to confirm.');
                showLogin();
            }
        } catch (error) {
            showToast('Error: ' + error.message);
        }
    }
    
    async function handleLogin() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        if (!email || !password) {
            showToast('Please fill in all fields');
            return;
        }
        
        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) throw error;
            currentUser = data.user;
            isGuest = false;
            await loadGameFromCloud();
            showToast('Welcome back!');
            showGameScreen();
            setupGame();
        } catch (error) {
            showToast('Error: ' + error.message);
        }
    }
    
    async function handleLogout() {
        try {
            if (!isGuest && currentUser) {
                await saveGameToCloud();
            }
            await supabaseClient.auth.signOut();
            currentUser = null;
            isGuest = false;
            resetGameState();
            showAuthScreen();
        } catch (error) {
            console.error('Logout error:', error);
        }
    }
    
    async function checkSession() {
        try {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                isGuest = false;
                await loadGameFromCloud();
                showGameScreen();
                setupGame();
            } else {
                showAuthScreen();
            }
        } catch (error) {
            console.error('Session check error:', error);
            showAuthScreen();
        }
    }
    
    // ==================== CLOUD SAVE/LOAD ====================
    async function saveGameToCloud() {
        if (isGuest || !currentUser) return;
        
        try {
            const saveData = {
                currency: gameState.currency,
                farmLevel: gameState.farmLevel,
                farmXP: gameState.farmXP,
                xpToNext: gameState.xpToNext,
                waterCapacity: gameState.waterCapacity,
                currentWater: gameState.currentWater,
                inventory: gameState.inventory,
                plants: gameState.plants,
                quests: gameState.quests,
                stats: gameState.stats
            };
            
            const { error } = await supabaseClient
                .from('game_saves')
                .upsert({
                    user_id: currentUser.id,
                    save_data: saveData,
                    save_version: 1,
                    device_info: navigator.userAgent,
                    last_played_at: new Date()
                }, { onConflict: 'user_id' });
            
            if (error) throw error;
            console.log('Cloud save successful');
        } catch (error) {
            console.error('Cloud save error:', error);
        }
    }
    
    async function loadGameFromCloud() {
        if (isGuest || !currentUser) return;
        
        try {
            const { data, error } = await supabaseClient
                .from('game_saves')
                .select('save_data')
                .eq('user_id', currentUser.id)
                .single();
            
            if (error && error.code !== 'PGRST116') throw error;
            
            if (data && data.save_data) {
                const sd = data.save_data;
                gameState.currency = sd.currency || 500;
                gameState.farmLevel = sd.farmLevel || 1;
                gameState.farmXP = sd.farmXP || 0;
                gameState.xpToNext = sd.xpToNext || 100;
                gameState.waterCapacity = sd.waterCapacity || 10;
                gameState.currentWater = sd.currentWater || 10;
                gameState.inventory = sd.inventory || { seeds: {}, crops: {}, gear: {} };
                gameState.plants = sd.plants || [];
                gameState.quests = sd.quests || [];
                gameState.stats = sd.stats || {};
                console.log('Cloud load successful');
                return true;
            } else {
                initializeNewGame();
                return false;
            }
        } catch (error) {
            console.error('Cloud load error:', error);
            initializeNewGame();
            return false;
        }
    }
    
    // ==================== GARDEN SETUP ====================
    function createGardenPlots() {
        const gardenArea = document.getElementById('garden-area');
        const plotsPerRow = 3;
        const plotsPerCol = 3;
        const totalPlots = plotsPerRow * plotsPerCol;
        
        gardenArea.innerHTML = '';
        gameState.plots = [];
        
        const areaWidth = gardenArea.clientWidth || window.innerWidth;
        const areaHeight = gardenArea.clientHeight || (window.innerHeight * 0.7);
        const horizontalSpacing = areaWidth / (plotsPerRow + 1);
        const verticalSpacing = areaHeight / (plotsPerCol + 2);
        
        for (let i = 0; i < totalPlots; i++) {
            const row = Math.floor(i / plotsPerRow);
            const col = i % plotsPerRow;
            const x = (col + 1) * horizontalSpacing - 40;
            const y = (row + 1) * verticalSpacing - 30;
            
            const plot = document.createElement('div');
            plot.className = 'soil-plot empty';
            plot.id = 'plot-' + i;
            plot.style.left = x + 'px';
            plot.style.top = y + 'px';
            
            const plotData = { id: i, element: plot, plant: null, x: x, y: y };
            gameState.plots.push(plotData);
            gardenArea.appendChild(plot);
            
            if (Math.random() > 0.7) {
                const decoration = document.createElement('div');
                decoration.style.cssText = 'position:absolute;font-size:20px;pointer-events:none;z-index:1;';
                decoration.style.left = (x + Math.random() * 60 - 30) + 'px';
                decoration.style.top = (y + Math.random() * 40 - 20) + 'px';
                decoration.textContent = ['🌿', '🪨', '🌼', '🍀'][Math.floor(Math.random() * 4)];
                gardenArea.appendChild(decoration);
            }
        }
        
        // Load existing plants
        gameState.plants.forEach(plant => {
            if (gameState.plots[plant.plotIndex]) {
                gameState.plots[plant.plotIndex].plant = plant;
                updatePlotVisual(plant.plotIndex);
            }
        });
    }
    
    // ==================== PLANT MANAGEMENT ====================
    function calculateGrowthStage(plant) {
        const seed = seedData[plant.seedKey];
        const elapsed = Date.now() - plant.plantedAt;
        const progress = elapsed / seed.growthTime;
        
        if (progress >= 1) return 4;
        if (progress >= 0.75) return 3;
        if (progress >= 0.5) return 2;
        if (progress >= 0.25) return 1;
        return 0;
    }
    
    function needsWater(plant) {
        return (Date.now() - plant.lastWateredAt) > 60000;
    }
    
    function plantSeed(plotIndex) {
        const seedKey = gameState.selectedSeed;
        if (!seedKey) return;
        
        if (!gameState.inventory.seeds[seedKey] || gameState.inventory.seeds[seedKey] <= 0) {
            showToast('No seeds available!');
            return;
        }
        
        if (gameState.plots[plotIndex].plant) {
            showToast('Plot is occupied!');
            return;
        }
        
        gameState.inventory.seeds[seedKey]--;
        
        const plant = {
            id: Date.now() + Math.random(),
            seedKey: seedKey,
            plotIndex: plotIndex,
            plantedAt: Date.now(),
            lastWateredAt: Date.now(),
            waterLevel: seedData[seedKey].waterNeeds,
            growthStage: 0,
            ready: false
        };
        
        gameState.plants.push(plant);
        gameState.plots[plotIndex].plant = plant;
        gameState.stats.totalPlanted++;
        
        updatePlotVisual(plotIndex);
        createPlantingEffect(gameState.plots[plotIndex]);
        updateQuestProgress('plant', 1);
        updateUI();
        saveGame();
        
        if (gameState.inventory.seeds[seedKey] <= 0) {
            gameState.selectedSeed = null;
            populateSeedBar();
        }
    }
    
    function waterPlant(plotIndex) {
        const plot = gameState.plots[plotIndex];
        if (!plot.plant || gameState.currentWater <= 0) return;
        
        plot.plant.waterLevel = seedData[plot.plant.seedKey].waterNeeds;
        plot.plant.lastWateredAt = Date.now();
        gameState.currentWater--;
        gameState.stats.totalWatered++;
        
        createWaterEffect(plot);
        updatePlotVisual(plotIndex);
        updateQuestProgress('water', 1);
        updateUI();
        saveGame();
    }
    
    function harvestPlant(plotIndex) {
        const plot = gameState.plots[plotIndex];
        if (!plot.plant || !plot.plant.ready) return;
        
        const plant = plot.plant;
        const seed = seedData[plant.seedKey];
        
        if (!gameState.inventory.crops[plant.seedKey]) {
            gameState.inventory.crops[plant.seedKey] = 0;
        }
        gameState.inventory.crops[plant.seedKey]++;
        
        const earnings = seed.sellValue;
        gameState.currency += earnings;
        gameState.stats.totalEarned += earnings;
        gameState.stats.totalHarvested++;
        gameState.farmXP += seed.xpReward;
        
        if (gameState.farmXP >= gameState.xpToNext) {
            gameState.farmLevel++;
            gameState.farmXP -= gameState.xpToNext;
            gameState.xpToNext = Math.floor(gameState.xpToNext * 1.5);
            gameState.waterCapacity += 2;
            gameState.currentWater = gameState.waterCapacity;
            showToast('Level Up! Level ' + gameState.farmLevel);
        }
        
        plot.plant = null;
        gameState.plants = gameState.plants.filter(p => p.id !== plant.id);
        
        createHarvestEffect(plot, seed.emoji);
        updateCurrencyDisplay(true);
        showToast('+1 ' + seed.name + ' (+' + earnings + ' Sh)');
        updateQuestProgress('harvest', 1);
        updateQuestProgress('earn', earnings);
        
        updatePlotVisual(plotIndex);
        updateUI();
        saveGame();
        
        if (!isGuest && currentUser) {
            saveGameToCloud();
        }
    }
    
    function updatePlantGrowth() {
        gameState.plants.forEach(plant => {
            if (!plant.ready) {
                const newStage = calculateGrowthStage(plant);
                
                if (newStage !== plant.growthStage) {
                    plant.growthStage = newStage;
                    updatePlotVisual(plant.plotIndex);
                    
                    if (newStage === 4) {
                        plant.ready = true;
                        showToast(seedData[plant.seedKey].name + ' is ready!');
                        updatePlotVisual(plant.plotIndex);
                    }
                }
                
                if (needsWater(plant)) {
                    plant.waterLevel = Math.max(0, plant.waterLevel - 1);
                    plant.lastWateredAt = Date.now();
                    updatePlotVisual(plant.plotIndex);
                }
            }
        });
    }

        // ==================== INPUT HANDLING ====================
        function setupInputHandlers() {
            document.addEventListener('touchstart', handleTouchStart, { passive: false });
            document.addEventListener('touchmove', handleTouchMove, { passive: false });
            document.addEventListener('touchend', handleTouchEnd, { passive: false });
            document.addEventListener('touchcancel', handleTouchCancel, { passive: false });
            document.addEventListener('mousedown', handleMouseDown);
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }
        
        function handleTouchStart(e) {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = true;
            
            const seedItem = e.target.closest('.seed-item');
            if (seedItem && gameState.selectedSeed) {
                isDraggingSeed = true;
                dragSeedType = gameState.selectedSeed;
                showGhostSeed(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }
        
        function handleTouchMove(e) {
            if (!isSwiping) return;
            
            const touch = e.touches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            if (isDraggingSeed) {
                moveGhostSeed(touch.clientX, touch.clientY);
                highlightPlotsAtPosition(touch.clientX, touch.clientY);
                e.preventDefault();
            } else if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                e.preventDefault();
            }
        }
        
        function handleTouchEnd(e) {
            if (!isSwiping) return;
            
            const touch = e.changedTouches[0];
            const deltaX = touch.clientX - touchStartX;
            const deltaY = touch.clientY - touchStartY;
            
            if (isDraggingSeed) {
                const plot = getPlotAtPosition(touch.clientX, touch.clientY);
                if (plot && !plot.plant && dragSeedType) {
                    gameState.selectedSeed = dragSeedType;
                    plantSeed(plot.id);
                }
                hideGhostSeed();
                clearPlotHighlights();
                isDraggingSeed = false;
                dragSeedType = null;
            } else if (Math.abs(deltaX) > 100 && Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX > 0) {
                    switchScreen(-1);
                } else {
                    switchScreen(1);
                }
            }
            
            isSwiping = false;
        }
        
        function handleTouchCancel() {
            isSwiping = false;
            isDraggingSeed = false;
            hideGhostSeed();
            clearPlotHighlights();
        }
        
        function handleMouseDown(e) {
            const seedItem = e.target.closest('.seed-item');
            if (seedItem && gameState.selectedSeed) {
                isDraggingSeed = true;
                dragSeedType = gameState.selectedSeed;
                showGhostSeed(e.clientX, e.clientY);
            }
        }
        
        function handleMouseMove(e) {
            if (isDraggingSeed) {
                moveGhostSeed(e.clientX, e.clientY);
                highlightPlotsAtPosition(e.clientX, e.clientY);
            }
        }
        
        function handleMouseUp(e) {
            if (isDraggingSeed) {
                const plot = getPlotAtPosition(e.clientX, e.clientY);
                if (plot && !plot.plant && dragSeedType) {
                    gameState.selectedSeed = dragSeedType;
                    plantSeed(plot.id);
                }
                hideGhostSeed();
                clearPlotHighlights();
                isDraggingSeed = false;
                dragSeedType = null;
            }
        }
        
        function showGhostSeed(x, y) {
            const ghost = document.getElementById('ghost-seed');
            ghost.textContent = seedData[gameState.selectedSeed].emoji;
            ghost.style.display = 'block';
            ghost.style.left = x + 'px';
            ghost.style.top = y + 'px';
        }
        
        function moveGhostSeed(x, y) {
            const ghost = document.getElementById('ghost-seed');
            ghost.style.left = x + 'px';
            ghost.style.top = y + 'px';
        }
        
        function hideGhostSeed() {
            document.getElementById('ghost-seed').style.display = 'none';
        }
        
        function highlightPlotsAtPosition(x, y) {
            clearPlotHighlights();
            const plot = getPlotAtPosition(x, y);
            if (plot) {
                if (!plot.plant && gameState.selectedSeed) {
                    plot.element.classList.add('valid-drop');
                } else {
                    plot.element.classList.add('invalid-drop');
                }
            }
        }
        
        function clearPlotHighlights() {
            gameState.plots.forEach(function(plot) {
                plot.element.classList.remove('valid-drop');
                plot.element.classList.remove('invalid-drop');
            });
        }
        
        function getPlotAtPosition(x, y) {
            for (let i = 0; i < gameState.plots.length; i++) {
                const plot = gameState.plots[i];
                const rect = plot.element.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    return plot;
                }
            }
            return null;
        }
        
        // ==================== SAVE SYSTEM ====================
        function saveGame() {
            // Local save
            try {
                localStorage.setItem('gardengrow_local_' + (isGuest ? 'guest' : currentUser?.id || 'guest'), JSON.stringify(gameState));
            } catch (e) {
                console.error('Local save error:', e);
            }
            
            // Cloud save (debounced)
            if (!isGuest && currentUser) {
                clearTimeout(window.cloudSaveTimeout);
                window.cloudSaveTimeout = setTimeout(function() {
                    saveGameToCloud();
                }, 5000);
            }
        }
        
        function loadLocalGame() {
            try {
                const saved = localStorage.getItem('gardengrow_local_' + (isGuest ? 'guest' : currentUser?.id || 'guest'));
                if (saved) {
                    const data = JSON.parse(saved);
                    Object.assign(gameState, data);
                    return true;
                }
            } catch (e) {
                console.error('Local load error:', e);
            }
            return false;
        }
        
        // ==================== DAY/NIGHT ====================
        function updateDayNightCycle() {
            const hour = new
